<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous NDR Recovery Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-8">
    <div class="max-w-3xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-400">Autonomous NDR Recovery Agent</h1>
            <p class="text-slate-400">Event-driven logistics automation prototype for ONDC & e-commerce supply chains.</p>
        </header>

        <!-- Simulation Control Card -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-8 shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Simulate Courier Webhook Event</h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Customer Name</label>
                    <input type="text" id="custName" value="Rahul Sharma" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Failure Reason Code</label>
                    <input type="text" id="reasonCode" value="Customer_Unavailable" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                </div>
            </div>
            <button onclick="triggerAgent()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded transition">
                Fire NDR Webhook Event 🚀
            </button>
        </div>

        <!-- Live Queue / Output Result -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Live Agent Execution Log</h2>
            <div id="resultBox" class="bg-slate-900 p-4 rounded border border-slate-700 text-sm font-mono text-slate-300 min-h-[120px] overflow-x-auto">
                Waiting for courier event payload...
            </div>
        </div>
    </div>

    <script>
        async function triggerAgent() {
            const name = document.getElementById('custName').value;
            const reason = document.getElementById('reasonCode').value;
            const resultBox = document.getElementById('resultBox');
            
            resultBox.innerHTML = "Processing webhook event through serverless function & Gemini API...";

            try {
                const response = await fetch('/api/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        awb: "DEL998877",
                        courier: "Delhivery",
                        status: "NDR_Initiated",
                        reason_code: reason,
                        customer_name: name,
                        customer_phone: "+919876543210"
                    })
                });

                const data = await response.json();
                resultBox.innerHTML = `
                    <span class="text-green-400 font-bold">✔ Status: ${data.status}</span><br>
                    <span class="text-blue-300 font-bold">📦 AWB:</span> ${data.awb}<br>
                    <span class="text-yellow-300 font-bold">💬 AI Generated WhatsApp Text:</span><br> "${data.generated_whatsapp_text}"<br><br>
                    <span class="text-slate-400 font-bold">⚡ Action Taken:</span> ${data.action_taken}
                `;
            } catch (err) {
                resultBox.innerHTML = `<span class="text-red-400">Error invoking webhook: ${err}</span>`;
            }
        }
    </script>
</body>
</html>
